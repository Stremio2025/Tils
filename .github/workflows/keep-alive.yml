name: Keep Render Service Alive

on:
  push:
  schedule:
   - cron: "5,10,15,20,25,30,35,40,45,50,55 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render
        run: |
          echo "Pinging Render..."
          curl -f \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            --verbose \
            https://tils-140b.onrender.com

  
